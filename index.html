<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cura Poster</title>
<style>
  :root {
    --bg: #0f0f12; --card: #1a1a20; --border: #2a2a33;
    --text: #f0eef4; --muted: #9a97a6;
    --accent: #e86a8a; --accent2: #6a8ae8;
    --green: #34c98e; --red: #e05656; --amber: #e8a33d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; padding-bottom: 80px; }
  header { position: sticky; top: 0; z-index: 30; background: rgba(15,15,18,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 12px 16px; }
  header .top { display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
  header .tokens { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--card); border: 1px solid var(--border); padding: 5px 10px; border-radius: 20px; white-space: nowrap; }
  header .tokens b { color: var(--text); }
  header .gear { background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px; }
  .hint { padding: 8px 14px; font-size: 12px; color: var(--muted); }

  .section { padding: 14px 16px 4px; }
  .section .stitle { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .section .stitle .n { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px; font-size: 11px; }
  .viewseg { margin-left: auto; display: flex; gap: 3px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
  .viewseg button { border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  .viewseg button.on { background: var(--accent); color: #fff; }

  .agenda { display: flex; flex-direction: column; gap: 8px; }
  .agenda.drop { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 12px; }
  .acard-wrap { position: relative; overflow: hidden; border-radius: 12px; background: var(--red); margin-bottom: 0px; }
  .delete-bg { position: absolute; inset: 0; background: var(--red); display: flex; align-items: center; justify-content: flex-end; padding-right: 24px; color: #fff; font-size: 20px; font-weight: 700; z-index: 1; }
  .acard { position: relative; display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px; cursor: grab; z-index: 2; transition: transform .15s ease; user-select: none; }
  .acard .thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex: none; background: #222; }
  .acard .stack { position: relative; width: 56px; height: 56px; flex: none; }
  .acard .stack img { position: absolute; width: 56px; height: 56px; border-radius: 8px; object-fit: cover; border: 1px solid var(--card); }
  .acard .stack img:nth-child(1){ top:0; left:0; }
  .acard .stack img:nth-child(2){ top:3px; left:3px; opacity:.6; }
  .acard .info { flex: 1; min-width: 0; }
  .acard .info .cap { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .acard .info .meta { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .acard .num { font-weight: 800; color: var(--muted); font-size: 15px; width: 18px; text-align: center; flex: none; }
  .acard .grip { color: var(--muted); font-size: 16px; flex: none; }
  .pill { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; }
  .pill.ok { background: var(--green); color: #05210f; }
  .pill.no { background: var(--red); color: #fff; }
  .pill.car { background: var(--accent2); color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .grid.drop { outline: 2px dashed var(--accent2); outline-offset: 4px; border-radius: 12px; }
  .cell { position: relative; aspect-ratio: 1/1; overflow: hidden; cursor: grab; background: var(--card); }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell.dim img { opacity: .35; filter: grayscale(.7); }
  .cell .p { position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 20px; }
  .cell .rm { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; border: 0; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; opacity: 0; transition: opacity .2s; }
  .cell:hover .rm { opacity: 1; }
  .cell .badge-left { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.7); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; z-index: 4; }

  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-nav .mnth { font-weight: 700; font-size: 14px; }
  .cal-nav button { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow { text-align: center; font-size: 10px; color: var(--muted); padding: 4px 0; font-weight: 700; }
  .cal-day { min-height: 96px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px; font-size: 11px; }
  .cal-day.empty { background: transparent; border-color: transparent; }
  .cal-day.today { border-color: var(--accent); }
  .cal-day .dnum { color: var(--muted); font-weight: 700; margin-bottom: 4px; font-size: 13px; }
  .cal-item { display: flex; align-items: center; gap: 6px; background: var(--bg); border-radius: 8px; padding: 4px 6px; margin-bottom: 4px; cursor: pointer; overflow: hidden; border: 1px solid var(--border); }
  .cal-item img { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex: none; }
  .cal-item span { font-size: 10px; color: var(--text); font-weight: 600; white-space: nowrap; }
  .cal-item.dup { border-color: var(--red); background: rgba(255,0,0,0.1); }

  .empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13px; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  .sheet { background: var(--bg); border: 1px solid var(--border); border-bottom: 0; border-radius: 18px 18px 0 0; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; padding: 16px; animation: up .22s ease; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet .photo { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; border: 1px solid var(--border); }
  .sheet .photos { display: flex; gap: 6px; overflow-x: auto; }
  .sheet .photos img { width: 90px; height: 90px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); }
  .sheet .label { font-size: 11px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .sheet textarea, .sheet input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; padding: 10px 12px; font-family: inherit; }
  .sheet textarea { resize: vertical; }
  .sheet .count { font-size: 11px; color: var(--muted); text-align: right; margin-top: 3px; }
  .sheet .help { font-size: 12px; color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
  .btn { border: 0; border-radius: 10px; padding: 11px 14px; font-size: 13px; font-weight: 700; cursor: pointer; color: #fff; }
  .btn.ok { background: var(--green); color: #05210f; }
  .btn.no { background: var(--red); }
  .btn.swap { background: var(--accent2); }
  .btn.ghost { background: var(--card); border: 1px solid var(--border); color: var(--text); }
  .btn.primary { background: var(--accent); }
  .btn.sm { padding: 8px 10px; font-size: 12px; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .row .btn { flex: 1; }

  /* chat Simone */
  #simone-fab { position: fixed; right: 18px; bottom: 84px; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 24px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.4); z-index: 60; }
  .prog-bar { width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 8px; display: none; }
  .prog-bar.active { display: block; }
  .prog-bar .fill { width: 30%; height: 100%; background: var(--accent); animation: ind 1.2s infinite linear; }
  @keyframes ind { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  .chat-msg { margin: 8px 0; max-width: 85%; padding: 10px 13px; border-radius: 14px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .chat-msg.user { background: var(--accent); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .chat-msg.simone { background: var(--card); border: 1px solid var(--border); margin-right: auto; border-bottom-left-radius: 4px; }
  .chat-msg.thinking { color: var(--muted); font-style: italic; }
  .chat-input { display: flex; gap: 8px; margin-top: 10px; }
  .chat-input input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 11px 13px; font-size: 14px; }
  .chat-input button { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 18px; font-weight: 700; cursor: pointer; }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--green); color: #05210f; font-weight: 700; font-size: 13px; padding: 10px 18px; border-radius: 24px; z-index: 90; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--red); color: #fff; }

  .sel-bar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 8px 14px; display: none; gap: 10px; align-items: center; z-index: 55; }
  .sel-bar.show { display: flex; }
  .cell.sel { outline: 3px solid var(--accent); outline-offset: -3px; }
  .cell.sel::after { content: '✓'; position: absolute; top: 6px; left: 6px; background: var(--accent); color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
  .htable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .htable th, .htable td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .htable th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
  .htable td.r { text-align: right; }
  .blist { margin: 0 0 10px; padding-left: 18px; }
  .blist li { margin: 4px 0; font-size: 13px; }
  .chip { display: inline-block; background: var(--border); padding: 3px 8px; border-radius: 12px; font-size: 11px; margin: 2px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Cura Poster</h1>
    <div class="tokens" id="tokens">—</div>
    <button class="gear" id="sel-btn" title="Selecionar fotos">☑️</button>
    <button class="gear" id="brief-btn" title="Varredura de Tendências (Casamentos)">🔥</button>
    <button class="gear" id="hist-btn" title="Histórico de gastos">💰</button>
    <button class="gear" id="refresh-btn" title="Atualizar dados">🔄</button>
    <button class="gear" id="gear" title="Configurar">⚙️</button>
  </div>
  <div class="hint" id="hint">Arraste para reordenar. Toque numa foto para editar. Use o botão rosa pra falar com a Simone.</div>
</header>

<div class="section">
  <div class="stitle">📅 Agenda <span class="n" id="agenda-n">0</span>
    <div class="viewseg">
      <button id="view-list" class="on">Lista</button>
      <button id="view-cal">Calendário</button>
    </div>
  </div>
  <div class="agenda" id="agenda"></div>
  <div class="empty" id="agenda-empty" style="display:none">Agenda vazia — arraste fotos da gaveta pra cá.</div>
</div>

<div class="section">
  <div class="stitle">🗂️ Gaveta <span class="n" id="gaveta-n">0</span></div>
  <div class="grid" id="gaveta"></div>
  <div class="empty" id="gaveta-empty" style="display:none">Gaveta vazia.</div>
</div>

<button id="simone-fab" title="Falar com a Simone">💬</button>
<div class="sel-bar" id="sel-bar">
  <span id="sel-count" style="font-size:13px">0 selecionadas</span>
  <button class="btn primary sm" id="sel-car">Criar Carrossel ▦</button>
  <button class="btn ghost sm" id="sel-simone">Pedir pra Simone</button>
  <button class="btn ghost sm" id="sel-clear">Limpar</button>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="overlay" id="settings-overlay"><div class="sheet" id="settings-sheet"></div></div>
<div class="overlay" id="simone-overlay"><div class="sheet" id="simone-sheet"></div></div>
<div class="overlay" id="hist-overlay"><div class="sheet" id="hist-sheet"></div></div>
<div class="overlay" id="brief-overlay"><div class="sheet" id="brief-sheet"></div></div>
<div class="toast" id="toast">Salvo</div>

<script>
let photos = [], extras = [], agenda = [], carousels = [];
let briefing = null, insights = null;
let spending = [], analysis = null, insightsInterval = 15;
let posted = new Set(), usage = {}, generatedAt = null;
let isHosted = false;
let viewMode = localStorage.getItem('cp_view') || 'list', calMonth = new Date();

const REPO_OWNER = 'orlandolovecapture-ops';
const REPO_NAME = 'cura-poster';
const PAT_KEY = 'cp_pat';
const PRICE_KEY = 'cp_price';
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW = ['D','S','T','Q','Q','S','S'];

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const toast = (m, err) => { const t = $('toast'); t.textContent = m; t.classList.toggle('err', !!err); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2200); };

function photoByKey(k){ return [...photos, ...extras].find(p => p.image_key === k); }
function carouselById(id){ return carousels.find(c => c.id === id); }
function inAgenda(k){ return agenda.some(a => a.image_key === k); }
function inAgendaCar(id){ return agenda.some(a => a.carousel_id === id); }

function b64e(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64d(s){ return decodeURIComponent(escape(atob(s))); }
function pat(){ return localStorage.getItem(PAT_KEY) || ''; }

async function ghGet(path){
  const r = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?t=` + Date.now(), {
    headers: { Authorization: `Bearer ${pat()}`, Accept: 'application/vnd.github+json' }
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  const j = await r.json();
  return { data: JSON.parse(b64d(j.content)), sha: j.sha };
}
async function ghPut(path, obj, sha, msg){
  const r = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${pat()}`, Accept: 'application/vnd.github+json' },
    body: JSON.stringify({ message: msg || 'edição pelo app', content: b64e(JSON.stringify(obj, null, 2)), sha })
  });
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  return r.json();
}

function priceCfg(){ try { return JSON.parse(localStorage.getItem(PRICE_KEY)) || {}; } catch(e){ return {}; } }
function monthCost(){
  const m = new Date().toISOString().slice(0,7);
  const u = usage[m]; if (!u) return null;
  const c = priceCfg();
  const inP = +(c.input ?? 0.15), outP = +(c.output ?? 0.60), brl = +(c.usd_brl ?? 5.5);
  const input = u.input ?? Math.round((u.tokens||0) * 0.6);
  const output = u.output ?? Math.round((u.tokens||0) * 0.4);
  return ((input/1e6)*inP + (output/1e6)*outP) * brl;
}
function renderTokens(){
  const m = new Date().toISOString().slice(0,7);
  const u = usage[m];
  const tok = u ? (u.tokens||0) : 0;
  const cost = monthCost();
  const cstr = cost != null ? 'R$ ' + cost.toFixed(2).replace('.', ',') : 'R$ 0,00';
  $('tokens').innerHTML = `${cstr} · <b>${tok.toLocaleString('pt-BR')}</b> tok`;
}

function fmt(s){ if(!s) return '—'; const d = new Date(s); return d.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit', hour:'2-digit', minute:'2-digit'}); }
function toLocalInput(s){ const d = new Date(s); const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function fromLocalInput(v){ return v ? new Date(v).toISOString() : null; }
function nextFreeSlot(){
  let base = new Date();
  const all = agenda.map(a=>new Date(a.scheduled_at)).filter(d=>!isNaN(d)).sort((a,b)=>b-a);
  if (all.length && all[0] > base) base = all[0];
  for (let d=0; d<60; d++) for (const [h,m] of [[9,0],[18,0]]){
    const cand = new Date(base); cand.setDate(cand.getDate()+d); cand.setHours(h,m,0,0);
    if (cand > new Date()) return cand.toISOString();
  }
  return new Date(Date.now()+86400000).toISOString();
}

function pillSingle(p){ return posted.has(p.image_key) ? '<span class="pill ok">publicada</span>' : (p.status==='rejected' ? '<span class="pill no">recusada</span>' : (p.status==='approved' ? '<span class="pill ok">aprovada</span>' : '')); }
function pillCar(c){ return posted.has(c.id) ? '<span class="pill ok">publicado</span>' : (c.status==='rejected' ? '<span class="pill no">recusado</span>' : '<span class="pill car">▦ carrossel</span>'); }

function renderList(){
  $('agenda').innerHTML = agenda.map((a,i) => {
    const isCar = a.kind === 'carousel';
    const id = isCar ? a.carousel_id : a.image_key;
    const past = new Date(a.scheduled_at) < new Date();
    if (isCar){
      const c = carouselById(a.carousel_id); if (!c) return '';
      const img1 = c.urls && c.urls[0] ? c.urls[0] : '';
      const img2 = c.urls && c.urls[1] ? c.urls[1] : '';
      return `<div class="acard-wrap" data-aid="${esc(id)}">
        <div class="delete-bg">🗑️</div>
        <div class="acard" data-cid="${esc(c.id)}">
          <span class="grip" title="Arraste para reordenar" draggable="true">⠿</span><span class="num">${i+1}</span>
          <span class="stack">${img1?`<img src="${esc(img1)}" draggable="false">`:''}${img2?`<img src="${esc(img2)}" draggable="false">`:''}</span>
          <div class="info">
            <div class="cap">${esc(c.caption || c.title || '(carrossel)')}</div>
            <div class="meta">${pillCar(c)} <span style="${past?'color:var(--amber)':''}">${fmt(a.scheduled_at)}</span> · ${(c.image_keys||[]).length} fotos</div>
          </div>
        </div></div>`;
    }
    const p = photoByKey(a.image_key); if (!p) return '';
    return `<div class="acard-wrap" data-aid="${esc(id)}">
      <div class="delete-bg">🗑️</div>
      <div class="acard" data-k="${esc(a.image_key)}">
        <span class="grip" title="Arraste para reordenar" draggable="true">⠿</span><span class="num">${i+1}</span>
        <img class="thumb" src="${esc(p.url)}" alt="" draggable="false">
        <div class="info">
          <div class="cap">${esc(p.caption || '(sem legenda)')}</div>
          <div class="meta">${pillSingle(p)} <span style="${past?'color:var(--amber)':''}">${fmt(a.scheduled_at)}</span>${(p.user_tags||[]).length?' · '+esc((p.user_tags||[]).join(' ')):''}</div>
        </div>
      </div></div>`;
  }).join('');
}
function renderCal(){
  const y = calMonth.getFullYear(), mo = calMonth.getMonth();
  const days = new Date(y, mo+1, 0).getDate();
  const off = new Date(y, mo, 1).getDay();
  const byDay = {};
  const slotCount = {};
  const itemCounts = {};
  agenda.forEach(a => {
    slotCount[a.scheduled_at] = (slotCount[a.scheduled_at] || 0) + 1;
    const aid = a.carousel_id || a.image_key;
    if (aid) itemCounts[aid] = (itemCounts[aid] || 0) + 1;
    const d = new Date(a.scheduled_at);
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    (byDay[key] = byDay[key] || []).push(a);
  });
  let h = `<div class="cal-nav"><button id="cal-prev">‹</button><span class="mnth">${MONTHS[mo]} ${y}</span><button id="cal-next">›</button></div><div class="cal-grid">`;
  DOW.forEach(d => h += `<div class="cal-dow">${d}</div>`);
  for (let i=0;i<off;i++) h += `<div class="cal-day empty"></div>`;
  const today = new Date();
  for (let day=1; day<=days; day++){
    const key = `${y}-${mo}-${day}`;
    const items = byDay[key] || [];
    const isToday = today.getFullYear()===y && today.getMonth()===mo && today.getDate()===day;
    h += `<div class="cal-day ${isToday?'today':''}"><div class="dnum">${day}</div>`;
    items.forEach(a => {
      const t = new Date(a.scheduled_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      const isDup = (slotCount[a.scheduled_at] || 0) > 1;
      const aid = a.carousel_id || a.image_key;
      const isRepeated = (itemCounts[aid] || 0) > 1;
      const alertText = isDup ? '⚠️ DUPLICADO' : (isRepeated ? '⚠️ REPETIDO' : '');
      const hasAlert = isDup || isRepeated;
      if (a.kind === 'carousel'){
        const c = carouselById(a.carousel_id); if (!c) return;
        const img1 = c.urls && c.urls[0] ? c.urls[0] : '';
        h += `<div class="cal-item ${hasAlert?'dup':''}" data-cid="${esc(c.id)}">${img1?`<img src="${esc(img1)}">`:''}<span>${t} ${alertText}</span></div>`;
      } else {
        const p = photoByKey(a.image_key); if (!p) return;
        h += `<div class="cal-item ${hasAlert?'dup':''}" data-k="${esc(a.image_key)}"><img src="${esc(p.url)}"><span>${t} ${alertText}</span></div>`;
      }
    });
    h += `</div>`;
  }
  h += `</div>`;
  $('agenda').innerHTML = h;
  $('cal-prev').onclick = () => { calMonth = new Date(y, mo-1, 1); render(); };
  $('cal-next').onclick = () => { calMonth = new Date(y, mo+1, 1); render(); };
}
function render(){
  renderTokens();
  if (viewMode === 'cal') renderCal(); else renderList();
  $('agenda-n').textContent = agenda.length;
  $('agenda-empty').style.display = agenda.length ? 'none' : 'block';
  $('view-list').classList.toggle('on', viewMode === 'list');
  $('view-cal').classList.toggle('on', viewMode === 'cal');

  const gavSec = document.querySelectorAll('.section')[1];
  if (gavSec) gavSec.style.display = (viewMode === 'cal') ? 'none' : 'block';

  const gavSingles = photos.filter(p => !inAgenda(p.image_key));
  const gavCars = carousels.filter(c => !inAgendaCar(c.id) && c.status !== 'rejected');
  const gav = [
    ...gavSingles.map(p => ({t:'s', k:p.image_key, url:p.url, status:p.status})),
    ...gavCars.map(c => ({t:'c', k:c.id, url:(c.urls&&c.urls[0])||'', count:(c.image_keys||[]).length, status:c.status}))
  ];
  $('gaveta').innerHTML = gav.map(g => `
    <div class="cell ${g.status==='rejected'?'dim':''}" draggable="true" data-k="${esc(g.t==='s'?g.k:'')}" data-cid="${esc(g.t==='c'?g.k:'')}">
      <img loading="lazy" src="${esc(g.url)}" alt="" draggable="false">
      ${g.t==='c'?`<span class="badge-left">▦ ${g.count} fotos</span>`:''}
      <button class="rm" data-rm-k="${esc(g.t==='s'?g.k:'')}" data-rm-cid="${esc(g.t==='c'?g.k:'')}" title="Remover">×</button>
    </div>`).join('');
  $('gaveta-n').textContent = gav.length;
  $('gaveta-empty').style.display = gav.length ? 'none' : 'block';
}
$('[view-list], #view-list').addEventListener('click', () => { viewMode='list'; localStorage.setItem('cp_view', 'list'); render(); });
$('[view-cal], #view-cal').addEventListener('click', () => { viewMode='cal'; localStorage.setItem('cp_view', 'cal'); render(); });

// ---------------- drag & drop ----------------
let dragKey = null, dragCid = null;
document.addEventListener('dragstart', e => {
  const el = e.target.closest('[draggable="true"]');
  if (el){ dragKey = el.dataset.k || null; dragCid = el.dataset.cid || null; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain', dragKey || dragCid);}catch(_){} }
});
document.addEventListener('dragend', () => { dragKey = null; dragCid = null; $('agenda').classList.remove('drop'); $('gaveta').classList.remove('drop'); });

const agendaEl = $('agenda');
agendaEl.addEventListener('dragover', e => { e.preventDefault(); agendaEl.classList.add('drop'); });
agendaEl.addEventListener('dragleave', () => agendaEl.classList.remove('drop'));
agendaEl.addEventListener('drop', e => {
  e.preventDefault(); agendaEl.classList.remove('drop');
  const id = dragKey || dragCid || e.dataTransfer.getData('text/plain'); if (!id) return;
  const target = e.target.closest('.acard');
  const cur = dragCid ? {carousel_id: dragCid} : {image_key: dragKey};
  const isIn = dragCid ? inAgendaCar(dragCid) : inAgenda(dragKey);
  const findIdx = a => dragCid ? (a.carousel_id === dragCid) : (a.image_key === dragKey);
  if (isIn){
    const from = agenda.findIndex(findIdx);
    let to = target ? agenda.findIndex(a => (a.carousel_id||a.image_key) === (target.dataset.cid||target.dataset.k)) : agenda.length - 1;
    if (from < 0) return;
    const [item] = agenda.splice(from, 1); agenda.splice(to, 0, item);
  } else {
    const item = dragCid ? {kind:'carousel', carousel_id: dragCid, scheduled_at: nextFreeSlot()} : {image_key: dragKey, scheduled_at: nextFreeSlot()};
    if (target){ const to = agenda.findIndex(a => (a.carousel_id||a.image_key) === (target.dataset.cid||target.dataset.k)); agenda.splice(to, 0, item); }
    else agenda.push(item);
  }
  render(); persist('reordenado');
});

// ---------------- swipe para excluir na agenda (estilo Mail iOS/Mac) ----------------
let swipeCard = null, swipeStartX = 0, swipeCurrentX = 0, wasSwiped = false;

function onSwipeStart(clientX, target){
  if (target.closest('.grip')) return;
  const card = target.closest('.acard');
  if (!card) return;
  swipeCard = card;
  swipeStartX = clientX;
  swipeCurrentX = swipeStartX;
  wasSwiped = false;
  swipeCard.style.transition = 'none';
}

function onSwipeMove(clientX, e){
  if (!swipeCard) return;
  swipeCurrentX = clientX;
  const diff = swipeCurrentX - swipeStartX;
  if (diff < 0){
    if (e && e.cancelable) e.preventDefault();
    if (Math.abs(diff) > 8) wasSwiped = true;
    swipeCard.style.transform = `translateX(${Math.max(diff, -140)}px)`;
  } else {
    swipeCard.style.transform = `translateX(0px)`;
  }
}

function onSwipeEnd(){
  if (!swipeCard) return;
  const diff = swipeCurrentX - swipeStartX;
  swipeCard.style.transition = 'transform .2s ease';
  if (diff < -90){
    swipeCard.style.transform = 'translateX(-100%)';
    const wrap = swipeCard.closest('.acard-wrap');
    if (wrap){
      const aid = wrap.dataset.aid;
      setTimeout(() => {
        agenda = agenda.filter(a => (a.carousel_id !== aid && a.image_key !== aid));
        render(); persist('removido da agenda');
        toast('Post removido da agenda');
      }, 200);
    }
  } else {
    swipeCard.style.transform = 'translateX(0px)';
  }
  setTimeout(() => { wasSwiped = false; }, 150);
  swipeCard = null;
}

// Suporte a trackpad / Magic Mouse horizontal scroll (wheel)

  if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && e.deltaX < -15){
    const card = e.target.closest('.acard');

      const wrap = card.closest('.acard-wrap');
      if (wrap){

        agenda = agenda.filter(a => (a.carousel_id !== aid && a.image_key !== aid));
        render(); persist('removido da agenda');
        toast('Post removido da agenda');
      }
    }
  }
}, {passive: true});

document.addEventListener('touchstart', e => onSwipeStart(e.touches[0].clientX, e.target), {passive: true});
document.addEventListener('touchmove', e => onSwipeMove(e.touches[0].clientX, e), {passive: false});
document.addEventListener('touchend', () => onSwipeEnd());

document.addEventListener('mousedown', e => {

});

function renderHistory(){

  const evts = (spending && spending.events) ? [...spending.events].reverse() : [];
  const cost = e => 'R$ ' + ((((e.input||0)/1e6)*inP + ((e.output||0)/1e6)*outP) * brl).toFixed(2).replace('.',',');
  const rows = evts.map(e => {

function act(a){
  const p = photoByKey(curKey); if (!p) return;
  if (a === 'approve') p.status = 'approved';
  else if (a === 'reject') {
    const reason = prompt('Por que você recusou esta foto? (A Simone vai aprender com seu feedback):', 'Foto escura / ângulo repetido');
    p.status = 'rejected';
    p.reject_reason = reason || '';
  }
  else if (a === 'swap'){ swap(curKey); return; }
  else if (a === 'schedule'){ agenda.push({image_key: curKey, scheduled_at: nextFreeSlot()}); }
  else if (a === 'unschedule'){ agenda = agenda.filter(x => x.image_key !== curKey); }
  else if (a === 'up' || a === 'down'){
    const i = agenda.findIndex(x => x.image_key === curKey);
    const j = a === 'up' ? i-1 : i+1;
    if (i >= 0 && j >= 0 && j < agenda.length){ [agenda[i], agenda[j]] = [agenda[j], agenda[i]]; }
  }
  else if (a === 'save'){
    p.caption = $('cap').value.trim();
    const cp = $('couple-input'); if (cp) p.couple = cp.value.trim();
    const t = $('tags').value.trim(); p.hashtags = t ? t.split(/\s+/).filter(Boolean) : [];
    const ut = $('usertags').value.trim();
    p.user_tags = ut ? ut.split(',').map(s => s.trim().replace(/^@/,'')).filter(Boolean).map(s => '@'+s) : [];
    const s = $('sched'); if (s){ const ag = agenda.find(x => x.image_key === curKey); if (ag) ag.scheduled_at = fromLocalInput(s.value) || ag.scheduled_at; }
  }
  if (a === 'save'){ closeSheet(); render(); persist('legenda editada'); }
  else { closeSheet(); render(); persist('atualizado'); }
}

function actCar(a){
  const c = carouselById(curCid); if (!c) return;
  if (a === 'approve') c.status = 'approved';
  else if (a === 'reject') {
    const reason = prompt('Por que você recusou este carrossel? (A Simone vai aprender com seu feedback):', 'Fotos muito parecidas');
    c.status = 'rejected';
    c.reject_reason = reason || '';
  }
  else if (a === 'unschedule'){ agenda = agenda.filter(x => x.carousel_id !== curCid); }
  else if (a === 'save'){
    c.caption = $('cap').value.trim();
    const cp = $('couple-input'); if (cp) c.couple = cp.value.trim();
    const t = $('tags').value.trim(); c.hashtags = t ? t.split(/\s+/).filter(Boolean) : [];
    const ut = $('usertags').value.trim();
    c.user_tags = ut ? ut.split(',').map(s => s.trim().replace(/^@/,'')).filter(Boolean).map(s => '@'+s) : [];
    const s = $('sched'); if (s){ const ag = agenda.find(x => x.carousel_id === curCid); if (ag) ag.scheduled_at = fromLocalInput(s.value) || ag.scheduled_at; }
  }
  if (a === 'save'){ closeSheet(); render(); persist('carrossel editado'); }
  else { closeSheet(); render(); persist('atualizado'); }
}

function swap(k){
  const pool = photos.filter(x => x.image_key !== k && !inAgenda(x.image_key));
  if (!pool.length){ toast('Sem fotos na gaveta pra trocar', true); return; }
  const e = pool[0];
  agenda.forEach(a => { if (a.image_key === k) a.image_key = e.image_key; });
  closeSheet(); render(); persist('foto trocada');
}

function closeSheet(){ $('overlay').classList.remove('open'); curKey = null; curCid = null; }
$('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSheet(); });

async function persist(msg){
  if (!isHosted){ toast(msg + ' (preview)'); return; }
  if (!pat()){ openSettings(); return; }
  try {
    const cur = await ghGet('state/queue.json');
    const obj = { generated_at: cur ? cur.data.generated_at : generatedAt, photos, extras, agenda, carousels };
    await ghPut('state/queue.json', obj, cur ? cur.sha : undefined, msg || 'edição pelo app');
    toast('Salvo na nuvem ✓');
  } catch(e){ toast('Erro ao salvar: ' + e.message, true); }
}

// ---------------- configurações ----------------
function openSettings(){
  const pc = priceCfg();
  $('settings-sheet').innerHTML = `
    <div class="label">Chave de acesso (token do GitHub)</div>
    <p class="help">Cole um <b>personal access token</b> com acesso ao repositório <b>${REPO_OWNER}/${REPO_NAME}</b> (permissão <b>Contents: Read &amp; Write</b>).</p>
    <input id="pat-input" type="password" placeholder="github_pat_..." value="${esc(pat())}">
    <div class="label">Preço do Gemini (USD por 1M tokens)</div>
    <p class="help">Padrão: entrada 0,15 · saída 0,60.</p>
    <input id="price-in" type="number" step="0.01" min="0" placeholder="entrada" value="${pc.input ?? 0.15}">
    <div style="height:6px"></div>
    <input id="price-out" type="number" step="0.01" min="0" placeholder="saída" value="${pc.output ?? 0.60}">
    <div class="label">Cotação USD → BRL</div>
    <input id="price-brl" type="number" step="0.01" min="0" placeholder="ex: 5.50" value="${pc.usd_brl ?? 5.5}">
    <div class="label">Análise de insights</div>
    <p class="help">A Simone analisa seus números a cada N dias (padrão 15) e sugere ajustes.</p>
    <input id="insights-interval" type="number" step="1" min="1" max="90" placeholder="dias" value="${insightsInterval ?? 15}">
    <div class="row" style="margin-top:12px">
      <button class="btn ghost sm" data-a="check-update">🔄 Verificar Atualizações</button>
    </div>
    <div class="row">
      <button class="btn ghost" data-a="cancel">Cancelar</button>
      <button class="btn primary" data-a="savecfg" style="flex:2">Salvar</button>
    </div>
  `;
  $('settings-overlay').classList.add('open');
  $('settings-sheet').querySelector('[data-a="check-update"]').addEventListener('click', () => {
    toast('Você está na versão mais recente ✓');
  });
  $('settings-sheet').querySelector('[data-a="savecfg"]').addEventListener('click', () => {
    const p = $('pat-input').value.trim();
    if (p) localStorage.setItem(PAT_KEY, p);
    localStorage.setItem(PRICE_KEY, JSON.stringify({ input: +$('price-in').value, output: +$('price-out').value, usd_brl: +$('price-brl').value }));
    insightsInterval = Math.max(1, +$('insights-interval').value || 15);
    (async () => {
      try {
        const cur = await ghGet('state/config.json');
        await ghPut('state/config.json', { insights_interval_days: insightsInterval }, cur ? cur.sha : undefined, 'config: intervalo');
      } catch(e){}
    })();
    $('settings-overlay').classList.remove('open');
    toast('Configurações salvas ✓'); render();
    if (isHosted && pat()) loadRemote();
  });
  $('settings-sheet').querySelector('[data-a="cancel"]').addEventListener('click', () => $('settings-overlay').classList.remove('open'));
}
$('gear').addEventListener('click', openSettings);
$('settings-overlay').addEventListener('click', e => { if (e.target.id === 'settings-overlay') $('settings-overlay').classList.remove('open'); });

// ---------------- Simone ----------------
let lastSimoneAt = null;
let simoneRunning = false, simoneCancel = false;
let chatHistory = [];

function openSimone(){
  $('simone-sheet').innerHTML = `
    <div class="label" style="margin-top:0">💬 Simone</div>
    <div id="chat" style="max-height:50vh; overflow-y:auto"></div>
    <div class="prog-bar" id="prog-bar" class="${simoneRunning?'active':''}"><div class="fill"></div></div>
    <div class="chat-input">
      <input id="simone-input" placeholder='Ex.: "faça um carrossel do casal Ana e Pedro"'>
      <button id="simone-send" style="${simoneRunning?'background:var(--red)':''}">${simoneRunning?'Parar':'Enviar'}</button>
    </div>
  `;
  if (simoneRunning) $('prog-bar').classList.add('active');
  $('simone-overlay').classList.add('open');

  // restaura histórico
  const c = $('chat');
  if (c){
    chatHistory.forEach(item => {
      const d = document.createElement('div');
      d.className = 'chat-msg ' + (item.who === 'user' ? 'user' : 'simone');
      d.textContent = item.text;
      c.appendChild(d);
    });
    c.scrollTop = c.scrollHeight;
  }

  $('simone-send').addEventListener('click', () => {
    const btn = $('simone-send');
    if (simoneRunning){
      simoneCancel = true;
      simoneRunning = false;
      btn.textContent = 'Enviar';
      btn.style.background = '';
      const prog = $('prog-bar'); if (prog) prog.classList.remove('active');
      addChat('simone', 'Ação interrompida.');
      return;
    }
    const v = $('simone-input').value.trim();
    if (v){ sendSimone(v); $('simone-input').value = ''; }
  });
  $('simone-input').addEventListener('keydown', e => { if (e.key === 'Enter'){ const v = $('simone-input').value.trim(); if (v){ sendSimone(v); $('simone-input').value = ''; } } });
}

function addChat(who, text){
  chatHistory.push({who, text});
  if (chatHistory.length > 12) chatHistory = chatHistory.slice(-12); // mantém últimos 6 pares (3 pares principais)
  const c = $('chat'); if (!c) return;
  const d = document.createElement('div');
  d.className = 'chat-msg ' + (who === 'user' ? 'user' : (who === 'simone' ? 'simone' : 'simone thinking'));
  d.textContent = text;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}
async function sendSimone(text){
  addChat('user', text);
  if (!isHosted){ addChat('simone', '(no preview a Simone não roda — ela funciona no app hospedado)'); return; }
  if (!pat()){ addChat('simone', 'Configure a chave na ⚙️ primeiro.'); return; }
  simoneRunning = true;
  simoneCancel = false;
  const btn = $('simone-send');
  if (btn){ btn.textContent = 'Parar'; btn.style.background = 'var(--red)'; }
  const prog = $('prog-bar');
  if (prog) prog.classList.add('active');

  try {
    const cur = await ghGet('state/simone_request.json');
    await ghPut('state/simone_request.json', { request: text, image_keys: [...selection], at: new Date().toISOString() }, cur ? cur.sha : undefined, 'simone: pedido');
    selection.clear(); renderSelBar();
    let before = null;
    try { const r = await ghGet('state/simone_reply.json'); before = r ? r.data.at : null; } catch(_){}
    addChat('simone', 'Processando em segundo plano...');
    const chatEl = $('chat');
    const thinkNode = chatEl ? chatEl.lastElementChild : null;

    // Roda em background global
    (async () => {
      for (let i=0; i<60; i++){
        if (simoneCancel) break;
        await new Promise(r => setTimeout(r, 5000));
        if (simoneCancel) break;
        try {
          const r = await ghGet('state/simone_reply.json');
          if (r && r.data.at !== before){
            if (thinkNode && thinkNode.parentNode) thinkNode.remove();
            const p = $('prog-bar'); if (p) p.classList.remove('active');
            const b = $('simone-send'); if (b){ b.textContent = 'Enviar'; b.style.background = ''; }
            simoneRunning = false;
            addChat('simone', r.data.reply);
            lastSimoneReply = r.data.reply;
            toast('A Simone concluiu seu pedido! 💬');
            await loadRemote();
            return;
          }
        } catch(_){}
      }
      if (thinkNode && thinkNode.parentNode) thinkNode.remove();
      const p = $('prog-bar'); if (p) p.classList.remove('active');
      const b = $('simone-send'); if (b){ b.textContent = 'Enviar'; b.style.background = ''; }
      simoneRunning = false;
      if (!simoneCancel) addChat('simone', 'Demorei demais (o robô pode estar ocupado). Tente de novo em instantes.');
    })();

  } catch(e){
    if (prog) prog.classList.remove('active');
    if (btn){ btn.textContent = 'Enviar'; btn.style.background = ''; }
    simoneRunning = false;
    addChat('simone', 'Erro: ' + e.message);
  }
}
$('simone-fab').addEventListener('click', openSimone);
$('simone-overlay').addEventListener('click', e => { if (e.target.id === 'simone-overlay') $('simone-overlay').classList.remove('open'); });

// ---------------- carregamento ----------------
async function loadRemote(){
  try {
    const [q, p, u, s, b, i, sp, an, cf] = await Promise.all([ghGet('state/queue.json'), ghGet('state/posted.json'), ghGet('state/usage.json'), ghGet('state/simone_reply.json'), ghGet('state/briefing.json'), ghGet('state/insights.json'), ghGet('state/spending.json'), ghGet('state/analysis.json'), ghGet('state/config.json')]);
    if (q){ photos = q.data.photos || []; extras = q.data.extras || []; agenda = q.data.agenda || []; carousels = q.data.carousels || []; generatedAt = q.data.generated_at; }
    if (p){ posted = new Set(Object.keys(p.data.posted || {})); }
    if (u){ usage = u.data; }
    if (s){ lastSimoneReply = s.data.reply; lastSimoneAt = s.data.at; }
    if (b){ briefing = b.data; }
    if (i){ insights = i.data; }
    if (sp){ spending = sp.data; }
    if (an){ analysis = an.data; }
    if (cf){ insightsInterval = cf.data.insights_interval_days ?? 15; }
    render();
  } catch(e){ toast('Erro ao carregar: ' + e.message, true); }
}
