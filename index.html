<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cura Poster</title>
<style>
  :root {
    --bg: #0f0f12; --card: #1a1a20; --border: #2a2a33;
    --text: #f0eef4; --muted: #9a97a6;
    --accent: #e86a8a; --accent2: #6a8ae8;
    --green: #34c98e; --red: #e05656; --amber: #e8a33d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding-bottom: 80px; }
  header { position: sticky; top: 0; z-index: 30; background: rgba(15,15,18,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; font-weight: 700; }
  .toolbar { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .section { padding: 16px; }
  .stitle { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .n { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px; font-size: 11px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card img { width: 100%; height: 140px; object-fit: cover; display: block; }
  .card .info { padding: 8px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fab { position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; border: 0; font-size: 24px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.5); z-index: 50; display: flex; align-items: center; justify-content: center; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
  .overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto; padding: 20px; position: relative; }
  .modal h2 { font-size: 18px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
  .modal .close { background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
  .chat-box { height: 350px; border: 1px solid var(--border); border-radius: 8px; background: #121216; padding: 12px; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 12px; border-radius: 8px; font-size: 13px; max-width: 80%; line-height: 1.4; }
  .msg.user { background: var(--accent2); color: #fff; align-self: flex-end; }
  .msg.simone { background: var(--card); border: 1px solid var(--border); color: var(--text); align-self: flex-start; }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input { flex: 1; background: #121216; border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>🐴 Cura Poster</h1>
  <div class="toolbar">
    <button class="btn" onclick="openHistory()">💰 Gastos</button>
    <button class="btn" onclick="openSettings()">⚙️ Ajustes</button>
  </div>
</header>

<div class="section">
  <div class="stitle">📅 Agenda <span class="n" id="agenda-count">0</span></div>
  <div id="agenda-list" style="display:flex; flex-direction:column; gap:8px; margin-bottom:24px;"></div>

  <div class="stitle">🗂️ Gaveta de Fotos <span class="n" id="gaveta-count">0</span></div>
  <div class="grid" id="gaveta-grid"></div>
</div>

<button class="fab" onclick="openSimone()" title="Falar com a Simone">💬</button>

<!-- Modal Simone -->
<div class="overlay" id="simone-modal">
  <div class="modal">
    <h2>💬 Assistente Simone <button class="close" onclick="closeSimone()">×</button></h2>
    <div class="chat-box" id="chat-messages">
      <div class="msg simone">Olá! Sou a Simone. Como posso ajudar na curadoria e planejamento dos seus posts hoje?</div>
    </div>
    <div class="chat-input-row">
      <input id="chat-input" placeholder="Ex.: Planejar posts do mês..." onkeypress="if(event.key==='Enter')sendChat()">
      <button class="btn primary" onclick="sendChat()">Enviar</button>
    </div>
  </div>
</div>

<!-- Modal Settings -->
<div class="overlay" id="settings-modal">
  <div class="modal">
    <h2>⚙️ Configurações <button class="close" onclick="closeSettings()">×</button></h2>
    <div style="font-size:13px; color:var(--muted); line-height:1.6">
      <p>O Cura Poster está rodando em modo local integrado com o seu acervo no Mac.</p>
      <br>
      <button class="btn primary" onclick="location.reload()">🔄 Atualizar Dados</button>
    </div>
  </div>
</div>

<!-- Modal History -->
<div class="overlay" id="hist-modal">
  <div class="modal">
    <h2>💰 Histórico de Custos <button class="close" onclick="closeHistory()">×</button></h2>
    <div id="hist-content" style="font-size:13px; color:var(--muted)">Carregando custos...</div>
  </div>
</div>

<script>
let agenda = [];
let photos = [];
let carousels = [];
let usage = {};

function initApp() {
  const D = window.APP_DATA || {};
  agenda = D.agenda || [];
  photos = D.photos || [];
  carousels = D.carousels || [];
  usage = D.usage || {};

  document.getElementById('agenda-count').textContent = agenda.length;
  document.getElementById('gaveta-count').textContent = photos.length;

  renderAgenda();
  renderGaveta();
}

function renderAgenda() {
  const el = document.getElementById('agenda-list');
  if (!agenda.length) {
    el.innerHTML = '<div style="color:var(--muted); font-size:12px">Nenhum post agendado.</div>';
    return;
  }
  el.innerHTML = agenda.map((a, i) => `
    <div style="background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between">
      <div>
        <div style="font-weight:600; font-size:13px">#${i+1} · ${a.scheduled_at || 'Data a definir'}</div>
        <div style="font-size:11px; color:var(--muted)">ID: ${a.image_key || a.carousel_id || 'Post'}</div>
      </div>
      <button class="btn" style="color:var(--red)" onclick="removeAgenda('${a.image_key || a.carousel_id}')">Remover</button>
    </div>
  `).join('');
}

function renderGaveta() {
  const el = document.getElementById('gaveta-grid');
  if (!photos.length) {
    el.innerHTML = '<div style="color:var(--muted); font-size:12px">Gaveta vazia.</div>';
    return;
  }
  el.innerHTML = photos.slice(0, 30).map(p => `
    <div class="card">
      <img src="${p.url}" alt="" loading="lazy">
      <div class="info">${p.couple || 'Foto'}</div>
    </div>
  `).join('');
}

function removeAgenda(id) {
  agenda = agenda.filter(x => x.image_key !== id && x.carousel_id !== id);
  document.getElementById('agenda-count').textContent = agenda.length;
  renderAgenda();
}

function openSimone() { document.getElementById('simone-modal').classList.add('show'); }
function closeSimone() { document.getElementById('simone-modal').classList.remove('show'); }
function openSettings() { document.getElementById('settings-modal').classList.add('show'); }
function closeSettings() { document.getElementById('settings-modal').classList.remove('show'); }
function openHistory() {
  document.getElementById('hist-modal').classList.add('show');
  document.getElementById('hist-content').innerHTML = `Total de tokens processados: <b>${usage.tokens || 0}</b><br>Custo estimado: R$ ${(usage.cost_brl || 0).toFixed(2)}`;
}
function closeHistory() { document.getElementById('hist-modal').classList.remove('show'); }

function sendChat() {
  const input = document.getElementById('chat-input');
  const txt = input.value.trim();
  if (!txt) return;
  
  const box = document.getElementById('chat-messages');
  box.innerHTML += `<div class="msg user">${txt}</div>`;
  input.value = '';
  box.scrollTop = box.scrollHeight;

  setTimeout(() => {
    box.innerHTML += `<div class="msg simone">Compreendido! Estou processando seu pedido de planejamento e curadoria sênior...</div>`;
    box.scrollTop = box.scrollHeight;
  }, 600);
}

window.addEventListener('DOMContentLoaded', initApp);
</script>

erar conversas (alcançou 45 comentários)."], "o_que_mudar": ["Parar de publicar fotos únicas estáticas com legendas curtíssimas ou excessivamente poéticas, pois entregam o menor alcance da conta (entre 150 e 196).", "Aumentar a taxa de salvamentos, que está muito baixa no geral (apenas 6 salvamentos somando todos os posts), um indicador vital para noivas buscando referências.", "Evitar o uso de legendas vazias apenas com hashtags ou siglas sem contar a história do casal ou explicar o conceito do trabalho."], "proximas_acoes": ["Priorizar a produção no formato Carrossel (com fotos do evento/ensaio) e Vídeos/Reels curtos, eliminando posts de imagem única.", "Sempre marcar a rede de fornecedores (espaço, cerimonial, noiva, make) nos vídeos e carrosséis para potencializar o alcance orgânico via colaboração.", "Criar mais vídeos focado em tirar dúvidas e resolver dores dos noivos (ex: 'O que fazer se chover', 'Como montar o cronograma de fotos', 'Erros no Pré-Wedding').", "Incluir chamadas para ação (CTA) focadas em salvamento nas legendas, como: 'Salve este post para usar de inspiração no seu grande dia'."], "updated_at": "2026-09-15T16:33:00.947910+00:00", "interval_days": 15}, "config": {"insights_interval_days": 15}};
